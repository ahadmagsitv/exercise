<title>Exercise Counter</title>
<style>

  #idle-screen h1 { margin:0; font-size:22px; font-weight:600; }
  #idle-screen p { margin:0; color:#8b8b9a; font-size:14px; }

  #verdict.clean { background:rgba(34,197,94,.18); color:#86efac; border:1px solid rgba(34,197,94,.4); }
  #verdict.flagged { background:rgba(245,158,11,.18); color:#fcd34d; border:1px solid rgba(245,158,11,.4); }

  #calib { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;

  #calib p { margin:0; font-size:13px; color:#a8a8b8; max-width:80%; }
  #calib .bar { width:180px; height:6px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; }
  #calib .bar span { display:block; height:100%; background:var(--accent); transition:width .1s linear; }
  button.primary { font-size:16px; font-weight:600; padding:12px 28px; border-radius:12px; border:none; background:var(--accent); color:#fff; cursor:pointer; box-shadow:0 8px 24px rgba(99,102,241,.4); }
  button.primary:hover { filter:brightness(1.1); }

  #panel { width:300px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:8px; box-shadow:0 20px 50px rgba(0,0,0,.4); align-self:stretch; margin:40px 0; }
  #panel h3 { margin:0 0 4px; font-size:13px; font-weight:600; color:#a0a0b0; text-transform:uppercase; letter-spacing:.06em; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.02); }
  .row.active { background:rgba(99,102,241,.12); box-shadow:0 0 0 1px rgba(99,102,241,.3); }
  /* exercise whose landmarks aren't all in frame — shown, but visibly not in play */
  .row.off { opacity:.4; }
  .row.off .peak { color:#8b8b9a; font-style:italic; }
  .row .name { display:flex; align-items:center; gap:10px; font-size:14px; min-width:0; }
  .row .name span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:#3a3a46; flex:none; }

  .legend { margin-top:4px; font-size:11px; line-height:1.5; color:#6b6b7a; }
  .legend b { color:#86efac; font-weight:600; }
  button.reset { margin-top:8px; font-size:14px; font-weight:600; padding:10px; border-radius:12px; border:1px solid var(--border); background:transparent; color:#c5c5d2; cursor:pointer; }
  button.reset:hover { background:rgba(255,255,255,.05); border-color:#4a4a5a; }
  button.ghost { font-size:13px; font-weight:600; padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:transparent; color:#a8a8b8; cursor:pointer; }
  button.ghost:hover { background:rgba(255,255,255,.05); color:#e8e8ef; }

  .row:hover { background:rgba(255,255,255,.05); }
  .row .help { flex:none; width:15px; height:15px; border-radius:50%; font-size:10px; font-weight:700;

  .row:hover .help { color:#c5c5d2; border-color:#6b6b7a; }
  /* how-to sheet */
  #guide { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
           padding:24px; background:rgba(4,4,10,.72); backdrop-filter:blur(6px); }
  #guide .sheet { width:min(920px,100%); max-height:88vh; overflow-y:auto; background:var(--card);
                  border:1px solid var(--border); border-radius:22px; padding:24px 26px 20px;
                  box-shadow:0 30px 80px rgba(0,0,0,.6); }
  #guide .sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  #guide h2 { margin:0; font-size:19px; font-weight:600; }

                  cursor:pointer; padding:0 4px; }
  #guide .close:hover { color:#e8e8ef; }
  #guide .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
  #guide .cards.single { grid-template-columns:minmax(0,300px); justify-content:center; }
  #guide .card { background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:16px;
                 padding:14px; display:flex; flex-direction:column; gap:5px; }
  #guide .card h4 { margin:6px 0 0; font-size:14px; font-weight:600; }
  #guide .card p { margin:0; font-size:12px; line-height:1.45; }
  #guide .card .what { color:#c5c5d2; }
  #guide .card .cue { color:#fcd34d; }
  #guide .card .view { color:#6b6b7a; font-size:11px; }
  /* push the link to the card's floor so a longer cue can't leave the row ragged */
  #guide .card a { margin-top:auto; padding-top:6px; font-size:12px; font-weight:600; color:#a5b4fc; text-decoration:none; }
  #guide .card a:hover { text-decoration:underline; }
  #guide .note { margin:18px 0 0; font-size:12px; line-height:1.5; color:#8b8b9a; }
  #guide .note b { color:#c5c5d2; }
  svg.demo { width:100%; height:130px; background:rgba(0,0,0,.28); border-radius:11px; }
  svg.demo .fig { stroke:var(--accent); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
  svg.demo .floor { stroke:#3a3a46; stroke-width:2; stroke-linecap:round; }
</style>

<body>
<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18",
    "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18/client",
    "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@0.10.14"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useRef, useCallback } from "react";
import { createRoot } from "react-dom/client";
import { PoseLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";

// Every threshold below traces to a row in docs/exercise-form-reference.md. Change one, change both.
const DEG = 180 / Math.PI;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// minimal 3D vector helpers — world landmarks are real (x,y,z) meters, not screen pixels
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z });
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z });
const mul = (v, s) => ({ x: v.x * s, y: v.y * s, z: v.z * s });
const mid = (a, b) => mul(add(a, b), 0.5);
const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const cross = (a, b) => ({ x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x });
const norm = v => Math.hypot(v.x, v.y, v.z);
const unit = v => { const n = norm(v) || 1; return mul(v, 1 / n); };
// component of v lying in the plane perpendicular to `axis` (i.e. v with the axis direction removed)
const flatten = (v, axis) => sub(v, mul(axis, dot(v, axis)));
// true 3D angle between two vectors, in degrees — coordinate-frame agnostic, unlike picking
// two of the three axes off screen-space landmarks (which is what this used to do)
function angle3(v1, v2) {
  const m = norm(v1) * norm(v2);
  return m === 0 ? 0 : Math.acos(clamp(dot(v1, v2) / m, -1, 1)) * DEG;
}

// Body-local axes from world landmarks, off the shoulder/hip midpoints (steadier than one side).
// MediaPipe world axes are x-right, y-down, z-depth, so `up` = hip->shoulder and `forward` is
// anterior (out of the chest). SIGN CAVEAT: `forward`'s direction is derived from that stated
// convention, not measured — if Extension triggers on leaning *forward*, flip the cross order.
// See docs/exercise-form-reference.md §5.
function bodyFrame(wlm) {
  const up = unit(sub(mid(wlm[11], wlm[12]), mid(wlm[23], wlm[24])));
  const right = unit(flatten(sub(wlm[12], wlm[11]), up));
  return { up, right, forward: unit(cross(up, right)) };
}
// signed lean of `v` away from neutral, measured along a calibrated body axis. Because the axis
// comes from the user's own captured rest pose, this is camera-tilt and body-proportion independent —
// which is what let lateral flexion / rotation / extension move off MediaPipe's rough screen-space z.
const lean = (v, axis) => Math.asin(clamp(dot(unit(v), axis), -1, 1)) * DEG;
// Dynamic knee valgus: how far the knee sits off the hip->ankle line, measured along the body's
// lateral axis and normalised by leg length. Signed, positive = displaced toward the person's right.
//
// The textbook measure is the frontal plane projection angle, but computing it by projecting the
// thigh/shank into the frontal plane degenerates precisely at squat depth: at parallel the thigh is
// horizontal and purely sagittal, so the projection is a zero-length vector and the angle is
// undefined. This point-to-line form measures the same medial/lateral displacement without
// projecting away the segment. KNEE_DEV_LIMIT is the equivalent of the literature's 10-degree FPPA
// screening threshold: a knee offset d on a leg of length L subtends ~2*asin(2d/L), so 10 deg
// corresponds to d/L ~= 0.044.
const KNEE_DEV_LIMIT = 0.044;
function kneeDev(wlm, right, h, k, a) {
  const axis = sub(wlm[a], wlm[h]);
  const len2 = dot(axis, axis) || 1e-9;
  const t = clamp(dot(sub(wlm[k], wlm[h]), axis) / len2, 0, 1);
  const onLine = add(wlm[h], mul(axis, t));
  return dot(sub(wlm[k], onLine), right) / (Math.sqrt(len2) || 1e-9);
}
const jointAngle = (wlm, a, b, c) => angle3(sub(wlm[a], wlm[b]), sub(wlm[c], wlm[b]));
// shoulder-line twist about the calibrated vertical, in degrees
function trunkTwist(wlm, cal) {
  const r = bodyFrame(wlm).right;
  return Math.atan2(dot(cross(cal.right, r), cal.up), dot(cal.right, r)) * DEG;
}
function pelvisTwist(wlm, cal) {
  const r = unit(flatten(sub(wlm[24], wlm[23]), cal.up));
  return Math.atan2(dot(cross(cal.hipRight, r), cal.up), dot(cal.hipRight, r)) * DEG;
}
const trunkVec = wlm => sub(mid(wlm[11], wlm[12]), mid(wlm[23], wlm[24]));

// --- calibration ------------------------------------------------------------------------------
// A rep cannot be graded against "neutral" without knowing what this user's neutral looks like.
// One second of relaxed standing gives us their body axes plus the personal baselines that the
// valgus / shrug / hip-shift rules are expressed as deviations from.
const CALIB_FRAMES = 30;
// The torso is the only hard requirement: it defines the body axes every metric is measured
// against. Legs are optional — without them the squat is unavailable, but the five arm and
// trunk exercises need nothing below the hips, so a user sitting at a desk can still train.
const TORSO_JOINTS = [11, 12, 23, 24];
const LEG_JOINTS = [25, 26, 27, 28];
// MediaPipe extrapolates joints it cannot see rather than omitting them, so an out-of-shot limb
// arrives either as a low-confidence landmark or as coordinates outside 0…1. Check both.
const seen = (lm, i) => (lm[i].visibility ?? 1) > 0.6 && (lm[i].presence ?? 1) > 0.6
  && lm[i].x >= 0 && lm[i].x <= 1 && lm[i].y >= 0 && lm[i].y <= 1;
const allSeen = (lm, idxs) => idxs.every(i => seen(lm, i));
// Standing = under 30° of knee flexion, i.e. interior angle above 150°. Same definition the
// rep detector's restValue uses, so "standing enough to calibrate" and "standing enough to end
// a rep" cannot drift apart.
const STANDING_INTERIOR = 150;
// Why calibration is not progressing, as something the user can act on — or null when ready.
// A progress bar that sits at 0% with no explanation is the worst possible failure here: the
// user cannot tell a broken app from a badly-framed one.
function calibrationBlocker(lm, wlm) {
  if (!lm || !wlm) return "I can't see anyone — step into view.";
  if (!allSeen(lm, TORSO_JOINTS))
    return "I need to see your shoulders and hips — move back a little.";
  // Only demand a standing pose when the legs are actually visible. If they are not, the user
  // is seated or close to the camera; their neutral seated torso is a perfectly good reference
  // for the arm and trunk exercises, which is all that will be offered to them.
  if (allSeen(lm, LEG_JOINTS) &&
      (jointAngle(wlm, 24, 26, 28) < STANDING_INTERIOR || jointAngle(wlm, 23, 25, 27) < STANDING_INTERIOR))
    return "Stand up straight to start.";
  return null;
}
function calibSample(lm, wlm) {
  const f = bodyFrame(wlm);
  const span = Math.abs(lm[12].x - lm[11].x) || 1e-3;
  // Leg-derived baselines are null, not 0, when the legs are out of frame — a 0 would read as a
  // real measurement and silently poison the valgus and hip-shift rules.
  const legs = allSeen(lm, LEG_JOINTS);
  return {
    up: f.up, right: f.right,
    hipRight: unit(flatten(sub(wlm[24], wlm[23]), f.up)),
    torso: norm(sub(wlm[12], wlm[24])),
    kneeR: legs ? kneeDev(wlm, f.right, 24, 26, 28) : null,
    kneeL: legs ? kneeDev(wlm, f.right, 23, 25, 27) : null,
    hipOverAnkle: legs ? ((lm[23].x + lm[24].x) / 2 - (lm[27].x + lm[28].x) / 2) / span : null,
    span, legs,
  };
}
function buildCalibration(samples) {
  const n = samples.length;
  const avgV = k => unit(samples.reduce((acc, s) => add(acc, s[k]), { x: 0, y: 0, z: 0 }));
  // skip nulls so a leg-derived baseline stays null rather than becoming NaN
  const avgN = k => {
    const v = samples.map(s => s[k]).filter(x => x != null);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  };
  const up = avgV("up");
  const right = unit(flatten(avgV("right"), up)); // re-orthonormalise after averaging
  return {
    up, right, forward: unit(cross(up, right)),
    hipRight: unit(flatten(avgV("hipRight"), up)),
    torso: avgN("torso"), kneeR: avgN("kneeR"), kneeL: avgN("kneeL"),
    hipOverAnkle: avgN("hipOverAnkle"), span: avgN("span"),
    // whether the legs were in frame for the whole baseline — gates the squat
    hasLegs: samples.every(s => s.legs),
  };
}

// --- exercises --------------------------------------------------------------------------------
// `metric` drives rep detection; `form` grades it. A rule with `check` runs every frame during the
// active phase (and must fail VIOLATION_FRAMES in a row to stick, so landmark jitter can't flag a
// rep); a rule with `peak` runs once at rep end against the rep's extreme value.
// minROM gates whether the rep counts at all — below it, the rep is a partial and is discarded.
// ponytail: right-side arm landmarks only, as before.
const EXERCISES = [
  { key: "squat", name: "Chair Squat", instruction: "Squat down, then stand back up.",
    points: [24, 26, 28], needs: [23, 24, 25, 26, 27, 28], requires: "your legs and feet in frame", readout: v => Math.round(180 - v) + "° flex",
    metric: (lm, wlm) => jointAngle(wlm, 24, 26, 28),
    // restValue is 150, not 160: a rep only closes when the knee comes back above it, and real
    // people finish a squat without locking out. Replayed over 25 real recordings, 160 left
    // 7 of 17 clips with a rep that never closed — never counted, never graded. See
    // docs/exercise-form-reference.md §6.
    activeWhen: "below", restValue: 150, activeValue: 130, minROM: 105, targetROM: 90,
    form: [
      { id: "depth", label: "Go deeper — aim for thighs parallel", peak: p => p <= 90 },
      { id: "lean", label: "Chest up — too much forward lean",
        check: (lm, wlm, cal) => Math.abs(lean(trunkVec(wlm), cal.forward)) < 45 },
      // valgus = each knee drifting toward the midline, i.e. the right knee moving left of its
      // own baseline and the left knee moving right of its own baseline
      { id: "valgus", label: "Knees out — don't let them cave in",
        check: (lm, wlm, cal) => kneeDev(wlm, cal.right, 24, 26, 28) - cal.kneeR > -KNEE_DEV_LIMIT
                              && kneeDev(wlm, cal.right, 23, 25, 27) - cal.kneeL < KNEE_DEV_LIMIT },
      { id: "symmetry", label: "Even weight — you're favouring one leg",
        check: (lm, wlm) => Math.abs(jointAngle(wlm, 24, 26, 28) - jointAngle(wlm, 23, 25, 27)) < 15 },
    ] },
  { key: "abduction", name: "Abduction", instruction: "Raise your arm out to the side, then lower it.",
    points: [24, 12, 16], needs: [11, 12, 14, 16, 23, 24], readout: v => Math.round(v) + "°",
    metric: (lm, wlm) => { const f = bodyFrame(wlm);
      return angle3(mul(f.up, -1), flatten(sub(wlm[16], wlm[12]), f.forward)); },
    activeWhen: "above", restValue: 30, activeValue: 80, minROM: 90, targetROM: 140,
    form: [
      { id: "range", label: "Reach higher — take it toward overhead", peak: p => p >= 140 },
      { id: "elbow", label: "Keep your arm straight",
        check: (lm, wlm) => jointAngle(wlm, 12, 14, 16) > 150 },
      { id: "shrug", label: "Don't shrug — keep the shoulder down",
        check: (lm, wlm, cal) => norm(sub(wlm[12], wlm[24])) < cal.torso * 1.08 },
      { id: "plane", label: "Out to the side — your arm drifted forward",
        check: (lm, wlm) => Math.abs(dot(unit(sub(wlm[16], wlm[12])), bodyFrame(wlm).forward)) < 0.34 },
      { id: "lean", label: "Don't lean away — keep your trunk still",
        check: (lm, wlm, cal) => Math.abs(lean(trunkVec(wlm), cal.right)) < 12 },
    ] },
  { key: "flexion", name: "Flexion", instruction: "Raise your arm forward, then lower it.",
    points: [24, 12, 16], needs: [11, 12, 14, 16, 23, 24], readout: v => Math.round(v) + "°",
    metric: (lm, wlm) => { const f = bodyFrame(wlm);
      return angle3(mul(f.up, -1), flatten(sub(wlm[16], wlm[12]), f.right)); },
    activeWhen: "above", restValue: 30, activeValue: 80, minROM: 90, targetROM: 140,
    form: [
      { id: "range", label: "Reach higher — take it toward overhead", peak: p => p >= 140 },
      { id: "elbow", label: "Keep your arm straight",
        check: (lm, wlm) => jointAngle(wlm, 12, 14, 16) > 150 },
      { id: "shrug", label: "Don't shrug — keep the shoulder down",
        check: (lm, wlm, cal) => norm(sub(wlm[12], wlm[24])) < cal.torso * 1.08 },
      { id: "plane", label: "Straight forward — your arm drifted out to the side",
        check: (lm, wlm) => Math.abs(dot(unit(sub(wlm[16], wlm[12])), bodyFrame(wlm).right)) < 0.34 },
      { id: "lean", label: "Don't lean back — keep your trunk still",
        check: (lm, wlm, cal) => Math.abs(lean(trunkVec(wlm), cal.forward)) < 12 },
    ] },
  { key: "lateralFlexion", name: "Lateral Flexion", instruction: "Face the camera. Bend sideways at the waist, then return.",
    points: [12, 24], needs: [11, 12, 23, 24], readout: v => Math.round(v) + "°",
    metric: (lm, wlm, cal) => Math.abs(lean(trunkVec(wlm), cal.right)),
    activeWhen: "above", restValue: 8, activeValue: 15, minROM: 20, targetROM: 30,
    form: [
      { id: "range", label: "Reach further down your leg", peak: p => p >= 30 },
      { id: "rotate", label: "Don't twist — bend straight to the side",
        check: (lm, wlm, cal) => Math.abs(trunkTwist(wlm, cal)) < 15 },
      { id: "sagittal", label: "Stay upright — don't lean forward or back",
        check: (lm, wlm, cal) => Math.abs(lean(trunkVec(wlm), cal.forward)) < 15 },
      { id: "hips", label: "Keep your hips still — bend, don't shift",
        check: (lm, wlm, cal) => { if (cal.hipOverAnkle == null) return true;   // no ankles, no reference
          const span = Math.abs(lm[12].x - lm[11].x) || 1e-3;
          const now = ((lm[23].x + lm[24].x) / 2 - (lm[27].x + lm[28].x) / 2) / span;
          return Math.abs(now - cal.hipOverAnkle) < 0.35; } },
    ] },
  { key: "rotation", name: "Rotation", instruction: "Face the camera. Twist your shoulders, then return.",
    points: [11, 12], needs: [11, 12, 23, 24], readout: v => Math.round(v) + "°",
    metric: (lm, wlm, cal) => Math.abs(trunkTwist(wlm, cal)),
    activeWhen: "above", restValue: 8, activeValue: 20, minROM: 30, targetROM: 45,
    form: [
      { id: "range", label: "Rotate further — aim for a quarter turn", peak: p => p >= 45 },
      { id: "pelvis", label: "Hips forward — turn the trunk, not the whole body",
        check: (lm, wlm, cal) => Math.abs(pelvisTwist(wlm, cal)) < Math.abs(trunkTwist(wlm, cal)) * 0.5 + 8 },
      { id: "sidebend", label: "Stay level — don't lean into the turn",
        check: (lm, wlm, cal) => Math.abs(lean(trunkVec(wlm), cal.right)) < 12 },
    ] },
  { key: "extension", name: "Extension", instruction: "Face the camera. Lean back, then return to standing.",
    points: [12, 24], needs: [11, 12, 23, 24], readout: v => Math.round(v) + "°",
    metric: (lm, wlm, cal) => Math.max(0, -lean(trunkVec(wlm), cal.forward)),
    activeWhen: "above", restValue: 5, activeValue: 12, minROM: 15, targetROM: 22,
    form: [
      { id: "range", label: "A little further back if it's comfortable", peak: p => p >= 22 },
      { id: "knees", label: "Keep your knees straight — arch from the back",
        check: (lm, wlm, cal) => !cal.hasLegs                                   // legs not in frame
          || (jointAngle(wlm, 24, 26, 28) > 155 && jointAngle(wlm, 23, 25, 27) > 155) },
      { id: "rotate", label: "Stay square — don't twist as you lean",
        check: (lm, wlm, cal) => Math.abs(trunkTwist(wlm, cal)) < 15 },
      { id: "sidebend", label: "Stay level — don't lean to one side",
        check: (lm, wlm, cal) => Math.abs(lean(trunkVec(wlm), cal.right)) < 12 },
    ] },
];
// a rule has to fail this many frames running before it counts against the rep — single-frame
// landmark noise routinely trips any individual threshold
const VIOLATION_FRAMES = 5;
// --- exercise demonstrations ------------------------------------------------------------------
// Animated inline SVG rather than photos or embedded clips: it ships inside this file, so it
// works with no network, cannot rot into a broken link, and carries no licensing question.
// Each figure is a stick body whose parts morph between a start and end pose via SMIL, which
// interpolates `points` and `cx`/`cy` numerically — so a pose pair is just two coordinate lists
// with matching point counts.
//
// `view` matters: abduction and lateral flexion happen in the frontal plane and read correctly
// head-on, but arm flexion and trunk extension are sagittal and would be invisible from the
// front, so those are drawn side-on. That mirrors how the movements are actually demonstrated.
const FIGURES = {
  squat: { view: "Facing the camera", cue: "Sit back and down, knees tracking over your toes.",
    head: [[50, 16], [50, 40]],
    parts: [
      ["50,27 50,66", "50,51 50,90"],
      ["34,60 38,44 50,29 62,44 66,60", "26,50 32,50 50,51 68,50 74,50"],
      ["40,112 42,88 50,66 58,88 60,112", "40,112 26,94 50,90 74,94 60,112"],
    ] },
  abduction: { view: "Facing the camera", cue: "Arm straight, lift out to the side — don't shrug.",
    head: [[50, 16], [50, 16]],
    parts: [
      ["50,27 50,66", "50,27 50,66"],
      ["34,60 38,44 50,29 62,44 66,60", "22,10 34,18 50,29 62,44 66,60"],
      ["40,112 42,88 50,66 58,88 60,112", "40,112 42,88 50,66 58,88 60,112"],
    ] },
  flexion: { view: "Shown from the side", cue: "Arm straight, lift forward and up.",
    head: [[46, 16], [46, 16]],
    parts: [
      ["48,27 48,66", "48,27 48,66"],
      ["58,60 55,44 48,29", "80,14 67,20 48,29"],
      ["42,112 45,88 48,66", "42,112 45,88 48,66"],
    ] },
  lateralFlexion: { view: "Facing the camera", cue: "Bend sideways only — no twisting, hips still.",
    head: [[50, 16], [34, 22]],
    parts: [
      ["50,27 50,66", "36,33 50,66"],
      ["34,60 38,44 50,29 62,44 66,60", "20,56 24,42 36,31 52,48 58,62"],
      ["40,112 42,88 50,66 58,88 60,112", "40,112 42,88 50,66 58,88 60,112"],
    ] },
  rotation: { view: "Facing the camera", cue: "Turn your shoulders, keep your hips pointing forward.",
    head: [[50, 16], [50, 16]],
    parts: [
      ["50,27 50,66", "50,27 50,66"],
      ["34,60 38,44 50,29 62,44 66,60", "44,58 45,42 50,30 59,41 63,55"],
      ["40,112 42,88 50,66 58,88 60,112", "40,112 42,88 50,66 58,88 60,112"],
    ] },
  extension: { view: "Shown from the side", cue: "Arch gently backwards, knees straight.",
    head: [[46, 16], [36, 21]],
    parts: [
      ["48,27 48,66", "38,31 48,66"],
      ["58,60 55,44 48,29", "48,62 45,46 38,30"],
      ["42,112 45,88 48,66", "42,112 45,88 48,66"],
    ] },
};
const loop3 = (a, b) => `${a};${b};${a}`;
function Demo({ exKey }) {
  const fig = FIGURES[exKey];
  if (!fig) return null;
  const timing = { dur: "3.2s", repeatCount: "indefinite", calcMode: "spline",
                   keyTimes: "0;0.5;1", keySplines: "0.4 0 0.2 1;0.4 0 0.2 1" };
  return (
    <svg className="demo" viewBox="0 0 100 122" aria-hidden="true">
      <line className="floor" x1="16" y1="114" x2="84" y2="114" />
      <circle className="fig" r="9" cx={fig.head[0][0]} cy={fig.head[0][1]} fill="none">
        <animate attributeName="cx" values={loop3(fig.head[0][0], fig.head[1][0])} {...timing} />
        <animate attributeName="cy" values={loop3(fig.head[0][1], fig.head[1][1])} {...timing} />
      </circle>
      {fig.parts.map(([from, to], i) => (
        <polyline key={i} className="fig" points={from} fill="none">
          <animate attributeName="points" values={loop3(from, to)} {...timing} />
        </polyline>
      ))}
    </svg>
  );
}
// Videos are linked as a YouTube *search*, not a fixed video id. A curated link would be one
// takedown away from a dead end inside an offline-capable page; a search always resolves.
const videoSearch = name =>
  "https://www.youtube.com/results?search_query=" +
  encodeURIComponent("how to do " + name + " exercise");

function ExerciseGuide({ only, onClose }) {
  const list = only ? EXERCISES.filter(e => e.key === only) : EXERCISES;
  return (
    <div id="guide" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-head">
          <h2>{only ? list[0].name : "How to do these"}</h2>
          <button className="close" onClick={onClose} aria-label="Close">×</button>
        </div>
        <div className={"cards" + (only ? " single" : "")}>
          {list.map(e => (
            <div className="card" key={e.key}>
              <Demo exKey={e.key} />
              <h4>{e.name}</h4>
              <p className="what">{e.instruction}</p>
              <p className="cue">{FIGURES[e.key].cue}</p>
              <p className="view">{FIGURES[e.key].view}</p>
              <a href={videoSearch(e.name)} target="_blank" rel="noopener noreferrer">Watch a video ↗</a>
            </div>
          ))}
        </div>
        <p className="note">Arm exercises track your <b>right</b> arm. The camera view is mirrored,
          so your right arm appears on the left of the screen — same as looking in a mirror.</p>
      </div>
    </div>
  );
}

const blankScore = () => EXERCISES.map(() => ({ total: 0, clean: 0, partial: 0, best: null }));
const blankState = () => EXERCISES.map(() => ({ phase: "rest", smooth: null, peak: null, streaks: {}, violations: [] }));
const VERDICT_MS = 2200;

function App() {
  const [stage, setStage] = useState("idle"); // idle | loading | calibrating | running
  const [score, setScore] = useState(blankScore);
  const [activeIdx, setActiveIdx] = useState(-1); // which exercise is mid-rep right now, -1 = none
  const [poseOk, setPoseOk] = useState(true); // is a person visible at all
  const [coach, setCoach] = useState(""); // live cue for the form rule currently being broken
  const [verdict, setVerdict] = useState(null); // { kind, text } for the last completed rep
  const [calibPct, setCalibPct] = useState(0);
  // which exercises have all their landmarks in frame right now — a seated user gets the five
  // torso exercises and not the squat, rather than a dead app
  const [available, setAvailable] = useState(() => EXERCISES.map(() => true));
  const [guide, setGuide] = useState(null); // null | "all" | exercise key
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const landmarkerRef = useRef(null);
  // ponytail: per-exercise rest/active phase, EMA of the raw metric (landmark jitter alone was
  // crossing thresholds), rep-extreme value, and per-rule consecutive-failure streaks
  const stRef = useRef(blankState());
  const scoreRef = useRef(blankScore()); // mirrors score state for the rAF loop
  const activeRef = useRef(-1);
  const coachRef = useRef("");
  const availRef = useRef(EXERCISES.map(() => true));
  const poseOkRef = useRef(true);
  const calRef = useRef(null); // captured neutral pose; null until calibration completes
  const calSamplesRef = useRef([]);
  const stageRef = useRef("idle");
  const verdictAtRef = useRef(0);
  const runningRef = useRef(false); // lets reset() stop the rAF loop without waiting for a re-render

  // A rep just ended. Grade the rep-extreme value against minROM/targetROM, fold in whatever
  // form rules stuck during the active phase, and turn that into one of three outcomes.
  const gradeRep = (ex, i) => {
    const st = stRef.current[i];
    const peak = st.peak;
    const reached = v => ex.activeWhen === "below" ? peak <= v : peak >= v;
    const s = scoreRef.current[i];
    if (peak == null || !reached(ex.minROM)) {
      s.partial += 1;
      return { kind: "partial", text: "Partial rep — didn't reach range, not counted" };
    }
    // peak-based rules can only be judged now that the rep is over
    const missed = ex.form.filter(r => r.peak && !r.peak(peak)).map(r => r.label);
    const broken = st.violations.concat(missed);
    s.total += 1;
    s.best = s.best == null ? peak : (ex.activeWhen === "below" ? Math.min(s.best, peak) : Math.max(s.best, peak));
    if (!broken.length) { s.clean += 1; return { kind: "clean", text: "Good rep — " + ex.readout(peak) }; }
    return { kind: "flagged", text: broken[0] };
  };

  const loop = useCallback(() => {
    const video = videoRef.current;
    const landmarker = landmarkerRef.current;
    if (!runningRef.current || !video || !landmarker) return;
    const now = performance.now();
    const result = landmarker.detectForVideo(video, now);
    const lm = result.landmarks && result.landmarks[0];
    const wlm = result.worldLandmarks && result.worldLandmarks[0];

    if (!!lm !== poseOkRef.current) { poseOkRef.current = !!lm; setPoseOk(!!lm); }

    // canvas's pixel buffer matches the video's native resolution, so the same object-fit:cover
    // CSS the video uses scales/crops the canvas identically — no manual crop math needed.
    const canvas = canvasRef.current;
    const ctx = canvas && canvas.getContext("2d");
    if (ctx && video.videoWidth) {
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    if (stageRef.current === "calibrating") {
      const blocker = calibrationBlocker(lm, wlm);
      if (blocker !== coachRef.current) { coachRef.current = blocker; setCoach(blocker || ""); }
      if (!blocker) {
        calSamplesRef.current.push(calibSample(lm, wlm));
        setCalibPct(Math.round(100 * calSamplesRef.current.length / CALIB_FRAMES));
        if (calSamplesRef.current.length >= CALIB_FRAMES) {
          calRef.current = buildCalibration(calSamplesRef.current);
          coachRef.current = ""; setCoach("");
          stageRef.current = "running";
          setStage("running");
        }
      } else if (calSamplesRef.current.length) {
        // they moved out of frame mid-capture — a half-captured baseline is worse than none
        calSamplesRef.current = [];
        setCalibPct(0);
      }
      requestAnimationFrame(loop);
      return;
    }

    const cal = calRef.current;
    if (lm && wlm && cal) {
      let changed = false;
      let nowActive = -1;
      let cue = "";
      const avail = EXERCISES.map(() => false);
      // every exercise is evaluated every frame — whichever one crosses active->rest gets its own
      // rep counted, so the user can do them in any order without picking one first.
      // ponytail: several exercises read overlapping landmarks, so more than one can flag "active"
      // in the same frame; the overlay/skeleton just shows the last match found. Fine for a single
      // demo user — add view-direction disambiguation if cross-triggering shows up in practice.
      EXERCISES.forEach((ex, i) => {
        const st = stRef.current[i];
        // every landmark the metric and its rules actually read has to be visible and in frame,
        // not just the two or three that get drawn
        const ok = allSeen(lm, ex.needs);
        avail[i] = ok;
        if (!ok) return;
        const raw = ex.metric(lm, wlm, cal);
        const s = st.smooth == null ? raw : st.smooth * 0.75 + raw * 0.25;
        st.smooth = s;

        const isActive = ex.activeWhen === "below" ? s < ex.activeValue : s > ex.activeValue;
        const isRest = ex.activeWhen === "below" ? s > ex.restValue : s < ex.restValue;
        if (st.phase === "rest" && isActive) {
          st.phase = "active";
          st.peak = s; st.streaks = {}; st.violations = [];
        } else if (st.phase === "active" && isRest) {
          st.phase = "rest";
          const v = gradeRep(ex, i);
          verdictAtRef.current = now;
          setVerdict(v);
          changed = true;
        }
        if (st.phase === "active") {
          nowActive = i;
          st.peak = ex.activeWhen === "below" ? Math.min(st.peak, s) : Math.max(st.peak, s);
          // a rule must fail VIOLATION_FRAMES in a row before it sticks to this rep; a single
          // bad frame is landmark noise, not bad form. Once stuck it stays stuck for the rep.
          ex.form.forEach(rule => {
            if (!rule.check) return;
            let held = true;
            try { held = rule.check(lm, wlm, cal); } catch (e) { return; }
            if (held) { st.streaks[rule.id] = 0; return; }
            st.streaks[rule.id] = (st.streaks[rule.id] || 0) + 1;
            // guard the re-trigger: a rule that fails, recovers, then fails again would
            // otherwise be recorded twice for one rep (seen on real recordings — IMG_2522
            // reported "symmetry" two times in a single rep)
            if (st.streaks[rule.id] === VIOLATION_FRAMES && !st.violations.includes(rule.label)) {
              st.violations.push(rule.label);
            }
          });
          if (st.violations.length) cue = st.violations[st.violations.length - 1];
          if (ctx) {
            // flip x to match the mirrored (scaleX(-1)) video so dots land on the real limb
            const pts = ex.points.map(idx => [(1 - lm[idx].x) * canvas.width, lm[idx].y * canvas.height]);
            const bad = st.violations.length > 0;
            ctx.strokeStyle = bad ? "#f59e0b" : "#4f7cff"; ctx.lineWidth = 4; ctx.fillStyle = "#fff";
            ctx.beginPath();
            pts.forEach(([x, y], k) => k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
            ctx.stroke();
            pts.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill(); });
          }
        }
      });
      if (changed) setScore(scoreRef.current.map(s => ({ ...s })));
      if (nowActive !== activeRef.current) { activeRef.current = nowActive; setActiveIdx(nowActive); }
      if (cue !== coachRef.current) { coachRef.current = cue; setCoach(cue); }
      if (avail.some((v, i) => v !== availRef.current[i])) { availRef.current = avail; setAvailable(avail); }
    }
    if (verdictAtRef.current && now - verdictAtRef.current > VERDICT_MS) {
      verdictAtRef.current = 0;
      setVerdict(null);
    }
    requestAnimationFrame(loop);
  }, []);

  const clearAll = () => {
    stRef.current = blankState();
    scoreRef.current = blankScore();
    calSamplesRef.current = [];
    calRef.current = null;
    activeRef.current = -1;
    coachRef.current = "";
    availRef.current = EXERCISES.map(() => true);
    setAvailable(availRef.current);
    poseOkRef.current = true;
    verdictAtRef.current = 0;
    setScore(scoreRef.current);
    setActiveIdx(-1);
    setPoseOk(true);
    setCoach("");
    setVerdict(null);
    setCalibPct(0);
  };

  const start = async () => {
    setStage("loading");
    stageRef.current = "loading";
    try {
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      landmarkerRef.current = await PoseLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numPoses: 1,
      });
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      videoRef.current.srcObject = stream;
      await videoRef.current.play();
    } catch (e) {
      setStage("idle");
      stageRef.current = "idle";
      setCoach("Couldn't start the camera: " + (e && e.message ? e.message : e));
      return;
    }
    clearAll();
    runningRef.current = true;
    // grading is all relative to the user's own neutral pose, so nothing can be counted until
    // that baseline exists — calibrate first, then start counting
    stageRef.current = "calibrating";
    setStage("calibrating");
    requestAnimationFrame(loop);
  };

  const reset = () => {
    runningRef.current = false;
    const stream = videoRef.current && videoRef.current.srcObject;
    if (stream) stream.getTracks().forEach(t => t.stop());
    clearAll();
    stageRef.current = "idle";
    setStage("idle");
  };

  const live = stage === "calibrating" || stage === "running";
  const ex = activeIdx >= 0 ? EXERCISES[activeIdx] : null;
  const guideNode = guide && <ExerciseGuide only={guide === "all" ? null : guide}
                                            onClose={() => setGuide(null)} />;
  // video stays mounted and displayed at all times — a display:none video won't reliably play,
  // and the opaque idle screen covers it anyway until we're live
  return (
    <div id="app">
      <div id="wrap" className={stage === "running" && !poseOk ? "error" : ""}>
        <video ref={videoRef} muted playsInline />
        <canvas ref={canvasRef} />
        {!live && (
          <div id="idle-screen">
            <h1>Exercise Counter</h1>
            <p>Pose-tracked reps with form grading, right from your camera. Do any exercise, any order.</p>
            <button className="primary" onClick={start} disabled={stage === "loading"}>
              {stage === "loading" ? "Loading model…" : "Start"}
            </button>
            <button className="ghost" onClick={() => setGuide("all")}>See how each exercise works</button>
            {coach && <p className="error" style={{ marginTop: 4 }}>{coach}</p>}
          </div>
        )}
        {stage === "calibrating" && (
          <div id="calib">
            <h2>Stand naturally</h2>
            <p>Face the camera, full body in frame, arms relaxed at your sides. This captures your
               neutral posture so every rep is graded against <em>your</em> body, not an average one.</p>
            <div className="bar"><span style={{ width: calibPct + "%" }} /></div>
            {/* never leave the bar sitting at 0% with no explanation — always name the fix */}
            {coach && <div id="coach">{coach}</div>}
          </div>
        )}
        {stage === "running" && (
          <>
            {verdict && <div id="verdict" className={verdict.kind}>{verdict.text}</div>}
            <div id="overlay">
              {poseOk ? (
                <>
                  <h2>{ex ? ex.name : "Ready"}</h2>
                  <p>{ex ? ex.instruction : "Perform any exercise from the list on the right."}</p>
                  {coach && <div id="coach">{coach}</div>}
                </>
              ) : <p className="error">Can't see you — step into frame.</p>}
            </div>
          </>
        )}
      </div>
      <div id="panel">
        <h3>Exercises</h3>
        {EXERCISES.map((e, i) => (
          <div key={e.key} role="button" tabIndex={0} title={"How to do " + e.name}
               onClick={() => setGuide(e.key)}
               onKeyDown={ev => (ev.key === "Enter" || ev.key === " ") && setGuide(e.key)}
               className={"row" + (i === activeIdx ? " active" : "")
                                    + (stage === "running" && !available[i] ? " off" : "")}>
            <span className="name"><span className="dot" /><span>{e.name}</span><span className="help">?</span></span>
            <span className="score">
              <span className="clean">{score[i].clean}</span>
              <span className="sep">/</span>
              <span className="total">{score[i].total}</span>
              <span className="peak">
                {stage === "running" && !available[i]
                  ? (e.requires || "not fully in frame")
                  : score[i].best == null ? "—" : "best " + e.readout(score[i].best)}
              </span>
            </span>
          </div>
        ))}
        <p className="legend"><b>clean</b> / counted reps. Reps that miss the minimum range are
          discarded as partials; reps with a form fault still count but aren't clean. Dimmed rows
          need more of you in frame — the five trunk and arm exercises work seated.</p>
        <button className="reset" onClick={reset}>Reset</button>
      </div>
      {guideNode}
    </div>
  );
}

// Exposed for the offline tuning/replay harness described in docs/exercise-form-reference.md §6 —
// lets a test drive the geometry and rule engine with recorded or synthetic landmarks, no camera.
window.__exercise = { EXERCISES, bodyFrame, calibSample, buildCalibration, lean, trunkTwist, pelvisTwist, trunkVec, kneeDev, jointAngle, angle3, calibrationBlocker };

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
